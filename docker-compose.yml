# Host port 3185 is reserved for this stack (avoids 80/443/3000/8011/etc).
# Log monitoring (Loki/Grafana) is native via start.bat / deploy/observability — not Docker.
# Postgres is internal-only except localhost publish for host API (start.bat).
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-pmas}
      POSTGRES_USER: ${POSTGRES_USER:-pmas}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - pgdata:/var/lib/postgresql/data
    # Host publish for local dev only — see docker-compose.local.yml (start.bat).
    # Server stack uses internal hostname db:5432; no host port bind needed.
    command:
      - postgres
      - -c
      - shared_buffers=${PG_SHARED_BUFFERS:-256MB}
      - -c
      - effective_cache_size=${PG_EFFECTIVE_CACHE_SIZE:-1GB}
      - -c
      - work_mem=${PG_WORK_MEM:-8MB}
      - -c
      - maintenance_work_mem=${PG_MAINTENANCE_WORK_MEM:-128MB}
      - -c
      - max_connections=${PG_MAX_CONNECTIONS:-100}
      - -c
      - checkpoint_completion_target=0.9
      - -c
      - wal_buffers=16MB
      - -c
      - random_page_cost=1.1
      - -c
      - password_encryption=scram-sha-256
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    image: termeh-pmas-api:latest
    env_file:
      - .env
    environment:
      APP_ENV: production
      PORT: "8080"
      COOKIE_SECURE: "false"
      CORS_ALLOWED_ORIGINS: "*"
    expose:
      - "8080"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  web:
    build:
      context: ./pmas-live
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ""
        API_INTERNAL_URL: http://api:8080
    image: termeh-pmas-web:latest
    environment:
      NODE_ENV: production
      API_INTERNAL_URL: http://api:8080
    expose:
      - "3000"
    depends_on:
      - api
    restart: unless-stopped

  gateway:
    image: nginx:1.27-alpine
    ports:
      - "3185:80"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api
      - web
    restart: unless-stopped

volumes:
  pgdata:
